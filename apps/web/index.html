<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<link rel="icon" type="image/x-icon" href="/favicon.ico" />
		<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
		<link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
		<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<!--
			Static fallbacks only. <Seo /> (src/seo/Seo.jsx) replaces the title,
			description and robots tag on every route via react-helmet-async; these
			values are what a crawler sees before React hydrates, so an empty <title>
			here was a real risk.
		-->
		<title>Yassine Travel - Luxury Private Morocco Tours</title>
		<meta name="description" content="Bespoke luxury private tours of Morocco - Sahara desert, imperial cities, five-star riads. Trusted by travellers from the US, UK, Canada &amp; Australia." />
		<meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1" />

		<!-- Google tag (gtag.js) -->
		<script async src="https://www.googletagmanager.com/gtag/js?id=G-VBCV6PMN9C"></script>
		<script>
			window.dataLayer = window.dataLayer || [];
			function gtag(){dataLayer.push(arguments);}
			gtag('js', new Date());
			gtag('config', 'G-VBCV6PMN9C');
		</script>
	</head>
	<body>
		<div id="root"></div>
		<script type="module" src="/src/entry-client.jsx"></script>
	</body>
</html>
